  }
  main.appendChild(chartSvg(rows));
}

function chartSvg(rows){
  const w=380, h=220, padL=34, padR=10, padT=14, padB=24;
  const values = rows.map(r=>r.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const x = i => padL + (i/(rows.length-1)) * (w-padL-padR);
  const y = v => padT + (1 - (v-min)/range) * (h-padT-padB);

  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  svg.setAttribute("width","100%");
  svg.setAttribute("height","240");

  // grid lines
  for(let i=0;i<=3;i++){
    const gy = padT + (i/3)*(h-padT-padB);
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",padL); line.setAttribute("x2",w-padR);
    line.setAttribute("y1",gy); line.setAttribute("y2",gy);
    line.setAttribute("stroke","#292524"); line.setAttribute("stroke-dasharray","3,3");
    svg.appendChild(line);
  }

  const pathD = rows.map((r,i)=> (i===0?"M":"L") + x(i).toFixed(1) + "," + y(r.value).toFixed(1)).join(" ");
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",pathD);
  path.setAttribute("fill","none");
  path.setAttribute("stroke","#e11d48");
  path.setAttribute("stroke-width","2.5");
  svg.appendChild(path);

  rows.forEach((r,i)=>{
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",x(i)); c.setAttribute("cy",y(r.value)); c.setAttribute("r","3.5");
    c.setAttribute("fill","#e11d48");
    svg.appendChild(c);
    if(i===0 || i===rows.length-1 || rows.length<=6){
      const lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
      lbl.setAttribute("x",x(i)); lbl.setAttribute("y",h-6);
      lbl.setAttribute("fill","#78716c"); lbl.setAttribute("font-size","9");
      lbl.setAttribute("text-anchor","middle"); lbl.setAttribute("font-family","monospace");
      lbl.textContent = r.date;
      svg.appendChild(lbl);
    }
  });
  // y-axis min/max labels
  [min,max].forEach(v=>{
    const lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
    lbl.setAttribute("x",4); lbl.setAttribute("y", y(v)+3);
    lbl.setAttribute("fill","#78716c"); lbl.setAttribute("font-size","9"); lbl.setAttribute("font-family","monospace");
    lbl.textContent = fmt(v);
    svg.appendChild(lbl);
  });

  return el("div",{class:"chartBox"},[svg]);
}

function sortedSessions(){
  // Newest-first by actual date, not insertion order — insertion order breaks
  // once a backdated/missed session gets logged after the fact.
  return [...state.sessions].sort((a,b)=> b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
}

function isPR(key, value, beforeSessionId){
  // True if `value` beats every earlier (by date) clean session's value for this lift.
  const ordered = sortedSessions();
  let seenSelf = beforeSessionId===undefined;
  let best = -Infinity;
  for(const s of ordered){
    if(!seenSelf){ if(s.id===beforeSessionId){ seenSelf=true; } continue; }
    const d = s.lifts && s.lifts[key];
    if(d && d.status==="clean" && d.value>best) best = d.value;
  }
  return value > best;
}

function stalledLifts(){
  // A lift counts as stalled if its 2 most recent (by date) logged attempts were both missed.
  const ordered = sortedSessions();
  const stalled = [];
  Object.keys(LIFTS).forEach(key=>{
    const recent = ordered.filter(s=>s.lifts && s.lifts[key]).slice(0,2);
    if(recent.length===2 && recent.every(s=>s.lifts[key].status==="missed")){
      stalled.push(key);
    }
  });
  return stalled;
}

function sessionTonnage(session){
  let total = 0;
  Object.entries(session.lifts||{}).forEach(([key,d])=>{
    const lift = LIFTS[key];
    if(!lift || !d.sets || !d.reps) return;
    const load = computeLoad(lift, d.value);
    total += load.total * d.sets * d.reps;
  });
  return Math.round(total);
}

function currentStreak(){
  // Consecutive calendar days, counting back from the most recent LOGGED DATE (not
  // insertion order), with something logged.
  const days = new Set(state.sessions.map(s=>s.date));
  if(days.size===0) return 0;
  const mostRecentDate = sortedSessions()[0].date;
  let streak = 0;
  let cursor = new Date(mostRecentDate+"T00:00:00");
  while(days.has(`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,"0")}-${String(cursor.getDate()).padStart(2,"0")}`)){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeWeekSummary(endDateStr){
  const end = new Date(endDateStr+"T00:00:00");
  const start = new Date(end); start.setDate(start.getDate()-6);
  const startStr = start.toISOString().slice(0,10);
  const weekSessions = state.sessions.filter(s=> s.date>=startStr && s.date<=endDateStr);
  const workouts = weekSessions.filter(s=>s.type!=="REST").length;
  const rests = weekSessions.filter(s=>s.type==="REST").length;
  const liftChanges = {};
  Object.keys(LIFTS).forEach(key=>{
    const entries = weekSessions.filter(s=>s.lifts && s.lifts[key]).sort((a,b)=> a.date.localeCompare(b.date));
    if(entries.length){
      const first = entries[0].lifts[key].value;
      const last = entries[entries.length-1].lifts[key].value;
      liftChanges[key] = { first, last, delta: Math.round((last-first)*100)/100 };
    }
  });
  const painEntries = (state.painLog||[]).filter(p=> p.date>=startStr && p.date<=endDateStr);
  const energyVals = weekSessions.filter(s=>s.energy).map(s=>s.energy);
  const avgEnergy = energyVals.length ? Math.round((energyVals.reduce((a,b)=>a+b,0)/energyVals.length)*10)/10 : null;
  return { startStr, endDateStr, workouts, rests, liftChanges, painEntries, avgEnergy };
}
