    }
    if(sp.sessions.length===0){
      content.appendChild(el("div",{class:"banner"},[
        "First split session: the weights below are starting guesses. Pick a load you can finish every rep with ~2 reps left, adjust it here, then tick each exercise when done."
      ]));
    }
    const stalled = spStalled(day.ex);
    if(stalled.length){
      content.appendChild(el("div",{class:"stallBanner"},[
        stalled.map(spName).join(", ") + " missed the last 2 attempts — drop the weight about 10% rather than repeating it."
      ]));
    }
    content.appendChild(el("div",{class:"eyebrow", style:"margin-top:6px;"},[
      el("span",{class:"dot"}),
      el("span",null,[ dayIdx===nextIdx ? "Next session" : "Chosen day" ]),
      el("span",{class:"mono", style:"font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-left:4px;"},[ plan.name ])
    ]));
    content.appendChild(el("div",{class:"bigTitle spTitle"},[ `Day ${dayIdx+1} · ${day.label}` ]));

    content.appendChild(el("div",{class:"colHeaderRow"},[
      el("span",{class:"spHdrName"},["Exercise"]),
      el("span",{class:"chCol"},["Per side"]),
      el("span",{class:"chCol right"},["Total"]),
      el("span",{style:"width:32px;"},[""]),
    ]));

    day.ex.forEach(k=>{
      const ex = SPLIT_EX[k];
      const val = ui.splitOver[k]!==undefined ? ui.splitOver[k] : spNext(k);
      const load = spLoad(k, val);
      const st = ui.splitStatus[k] || "skipped";
      const step = ex.kind==="perSide" ? MIN_STEP : spInc(k);
      const row = el("div",{class:"liftRowCompact spRow"+(st==="clean"?" ticked":"")});

      const meta = `${ex.group} · ${ex.sets}×${ex.reps}` + (spEverLogged(k) ? "" : " · calibrate") + (sp.hold[k] ? " · hold" : "");
      const nameBox = el("div",{class:"spName"},[
        el("span",{class:"spN"},[spName(k)]),
        el("span",{class:"spMeta"},[meta]),
        ex.kind==="perSide" ? el("span",{class:"spPlates mono"},[spPlatesText(load)]) : null,
      ]);
      row.appendChild(nameBox);

      const editVal = ex.kind==="perSide" ? load.sideValue : val;
      const commit = (newVal)=>{
        newVal = Math.max(0, r2(newVal));
        ui.splitOver[k] = newVal; paint();
      };
      const input = el("input",{class:"spVal mono", type:"number", step:step, value:editVal, onChange:(e)=>{ commit(parseFloat(e.target.value)||0); }});
      const stepper = el("div",{class:"stepperGroup"},[
        el("button",{class:"stepBtn", type:"button", onClick:()=>{ commit(editVal-step); }},["−"]),
        input,
        el("button",{class:"stepBtn", type:"button", onClick:()=>{ commit(editVal+step); }},["+"]),
      ]);
      if(ex.kind==="perSide"){
        row.appendChild(el("div",{class:"lcol"},[stepper]));
        row.appendChild(el("div",{class:"lcol right"},[ el("span",{class:"spTotal mono"},[fmt(load.total)+"kg"]) ]));
      } else {
        row.appendChild(el("div",{class:"lcol"}));
        row.appendChild(el("div",{class:"lcol right"},[stepper]));
      }
      const mark = st==="clean" ? "✓" : (st==="missed" ? "!" : "");
      row.appendChild(el("button",{class:"tickBtn spTick "+st, type:"button", title:"Tap: done · again: missed reps · again: skipped", onClick:()=>{
        ui.splitStatus[k] = st==="skipped" ? "clean" : (st==="clean" ? "missed" : "skipped"); paint();
      }},[mark]));
      content.appendChild(row);
    });

    content.appendChild(el("div",{class:"spLegend"},["Tap the box: ✓ all reps done · ! missed reps (weight holds) · empty = skipped"]));

    const eRow = el("div",{class:"spEnergy"},[ el("span",{class:"clbl"},["Energy"]) ]);
    [1,2,3,4,5].forEach(n=>{
      eRow.appendChild(el("button",{class:"spEBtn"+(ui.splitEnergy===n?" active":""), type:"button", onClick:()=>{
        ui.splitEnergy = ui.splitEnergy===n ? null : n; paint();
      }},[String(n)]));
    });
    content.appendChild(eRow);

    const msg = el("div",{class:"spMsg", style:"display:none;"},["Tick at least one exercise first."]);
    const actionRow = el("div",{class:"actionRow"});
    actionRow.appendChild(el("input",{type:"date", class:"dateBtn", value:ui.splitDate, max:todayLocal(), onChange:(e)=>{ ui.splitDate = e.target.value || todayLocal(); }}));
    actionRow.appendChild(el("button",{class:"btn btn-primary actionMiddle", type:"button", onClick:()=>{
      if(logSplitSession(day, dayIdx)){ render(); } else { msg.style.display = "block"; }
    }},["Log this session"]));
    content.appendChild(actionRow);
    content.appendChild(msg);
    content.appendChild(el("button",{class:"linkBtn", type:"button", onClick:()=>{ ui.tab="settings"; render(); }},["Change split plan →"]));
    requestAnimationFrame(fitTodayToScreen);
  }
  paint();
}

function renderSplitProgress(main){
  const sp = ensureSplit();
  const chipRow = el("div",{class:"chipRow"});
  Object.keys(SPLIT_EX).forEach(k=>{
    chipRow.appendChild(el("button",{class:"chip"+(ui.splitLift===k?" active":""), type:"button", onClick:()=>{ ui.splitLift=k; render(); }},[spName(k)]));
  });
  main.appendChild(chipRow);
  const ex = SPLIT_EX[ui.splitLift] || SPLIT_EX.smithsq;
  const rows = spSessionList()
    .filter(s=>s.lifts && s.lifts[ui.splitLift] && s.lifts[ui.splitLift].status!=="skipped")
    .map(s=>({date:s.date.slice(5), value:s.lifts[ui.splitLift].value}));
  main.appendChild(el("div",{class:"clbl", style:"margin-bottom:4px;"},[ ex.kind==="perSide" ? "kg per side" : "kg on the stack" ]));
  if(rows.length<2){
    main.appendChild(el("div",{class:"emptyState"},["Not enough split sessions logged for this exercise yet."]));
    return;
  }
  main.appendChild(chartSvg(rows));
}

function renderSplitHistory(main){
  const sp = ensureSplit();
  const list = spSessionList().reverse();
  if(!list.length){
    main.appendChild(el("div",{class:"emptyState"},["No split sessions logged yet. Start from the Today tab."]));
    return;
  }
  main.appendChild(el("div",{style:"margin-bottom:8px;"},[ el("span",{class:"mono", style:"font-size:11px; color:var(--text-faint);"},[`${list.length} split sessions logged`]) ]));
  list.forEach(s=>{
    const isOpen = ui.splitExpanded===s.id;
    const item = el("div",{class:"histItem"});
    item.appendChild(el("button",{class:"histHead", type:"button", onClick:()=>{ ui.splitExpanded = isOpen?null:s.id; render(); }},[
      el("div",{class:"left"},[
        el("span",{class:"wtype"},[ `D${(s.day|0)+1} ${s.dayLabel||""}` ]),
        el("span",{class:"wdate"},[s.date])
      ]),
      (()=>{ const i=icon("chevronDown",16); i.style.color="#78716c"; i.style.transform = isOpen?"rotate(180deg)":"none"; return i; })()
    ]));
    if(isOpen){
      const body = el("div",{class:"histBody"});
      Object.entries(s.lifts||{}).forEach(([k,d])=>{
        if(!SPLIT_EX[k]) return;
        const ex = SPLIT_EX[k];
        const load = spLoad(k, d.value);
        const txt = ex.kind==="perSide" ? `${fmt(d.value)}/side (${fmt(load.total)}kg)` : `${fmt(d.value)}kg`;
        const right = el("div",{style:"display:flex; align-items:center; gap:8px;"},[ el("span",{class:"rval"},[txt]) ]);
        if(d.status==="clean"){ const i=icon("check",13); i.style.color="#34d399"; right.appendChild(i); }
        if(d.status==="missed"){ right.appendChild(el("span",{class:"flag-missed"},["Missed reps"])); }
        if(d.status==="skipped"){ const i=icon("x",13); i.style.color="#6b6560"; right.appendChild(i); }
        body.appendChild(el("div",{class:"histRow"},[ el("span",{class:"lname"},[`${spName(k)} · ${d.sets||ex.sets}×${d.reps||ex.reps}`]), right ]));
      });
      if(s.energy){ body.appendChild(el("div",{class:"histRow"},[ el("span",{class:"lname"},["Energy"]), el("span",{class:"rval"},[`${s.energy}/5`]) ])); }
      const delRow = el("div",{class:"delRow"});
      if(ui.splitConfirmDeleteId===s.id){
        const pw = el("input",{type:"password", placeholder:"Enter password to delete", style:"width:130px; background:var(--bg); border:1px solid var(--surface-alt); border-radius:5px; padding:4px 7px; color:var(--text); font-size:11px; margin-right:6px;"});
        const err = el("span",{style:"font-size:10px; color:#f4a5a5; display:none; margin-right:6px;"},["Wrong password"]);
        const doDelete = ()=>{
          if(pw.value===DELETE_PASSWORD){
            sp.sessions = sp.sessions.filter(x=>x.id!==s.id);
            saveStore(); ui.splitConfirmDeleteId = null; render();
          } else { err.style.display="inline"; pw.value=""; }
        };
        pw.addEventListener("keydown",(e)=>{ if(e.key==="Enter") doDelete(); });
        delRow.appendChild(pw); delRow.appendChild(err);
        delRow.appendChild(el("a",{onClick:doDelete},["Delete"]));
        delRow.appendChild(el("a",{onClick:()=>{ ui.splitConfirmDeleteId=null; render(); }},["Cancel"]));
      } else {
        delRow.appendChild(el("a",{onClick:()=>{ ui.splitConfirmDeleteId=s.id; render(); }},["Delete"]));
      }
      body.appendChild(delRow);
      item.appendChild(body);
    }
    main.appendChild(item);
  });
}

function renderSplitSettings(main){
  const sp = ensureSplit();
  const sec = el("div",{class:"settingsSection"});
  sec.appendChild(el("div",{class:"bigTitle", style:"font-size:20px; margin-bottom:6px;"},["Split Settings"]));
  sec.appendChild(el("div",{class:"spNote"},["Every day: Smith squat + 1 leg machine + 1 abs + 2 upper-body + rear delts = 6 exercises. The plan decides what the upper-body pair is."]));

  sec.appendChild(el("label",{class:"lbl"},["Split plan"]));
  Object.entries(SPLIT_PLANS).forEach(([id,p])=>{
    sec.appendChild(el("div",{class:"spPlanCard"+(sp.plan===id?" active":""), onClick:()=>{
      if(sp.plan===id) return;
      sp.plan = id; saveStore(); ui.splitDay = null; render();
    }},[
      el("div",{class:"spPlanName"},[ p.name + (sp.plan===id ? "  ✓ selected" : "") ]),
      el("div",{class:"spPlanNote"},[p.note]),
      el("div",{class:"spPlanDays mono"},[ p.days.map((d,i)=>`D${i+1} ${d.label}`).join("  ·  ") ]),
    ]));
  });

  sec.appendChild(el("label",{class:"lbl", style:"margin-top:10px;"},["Smith machine bar weight (kg)"]));
  sec.appendChild(el("div",{class:"weightRow"},[
    el("span",{class:"name"},["Empty bar (check the label on your Smith)"]),
    el("input",{type:"number", step:"0.5", value:sp.smithBase, onChange:(e)=>{
      const v = parseFloat(e.target.value); if(!isNaN(v) && v>=0){ sp.smithBase = v; saveStore(); } }})
  ]));

  sec.appendChild(el("label",{class:"lbl", style:"margin-top:10px;"},["Exercises — name · next weight · step"]));
  const groups = [];
  Object.keys(SPLIT_EX).forEach(k=>{ const g=SPLIT_EX[k].group; if(!groups.includes(g)) groups.push(g); });
  groups.forEach(g=>{
    sec.appendChild(el("div",{class:"spGroup"},[g]));
    Object.keys(SPLIT_EX).filter(k=>SPLIT_EX[k].group===g).forEach(k=>{
      const ex = SPLIT_EX[k];
      const nameIn = el("input",{type:"text", class:"spCfgName", value:spName(k), onChange:(e)=>{
        const v = e.target.value.trim(); if(v && v!==ex.name) sp.names[k]=v; else delete sp.names[k]; saveStore(); }});
      const nextIn = el("input",{type:"number", class:"spCfgNum", step:"0.25", value:spNext(k), title: ex.kind==="perSide"?"kg per side":"kg on stack", onChange:(e)=>{
        const v = parseFloat(e.target.value); if(!isNaN(v) && v>=0){ sp.next[k]=v; saveStore(); } }});
      const incIn = el("input",{type:"number", class:"spCfgNum", step:"0.25", value:spInc(k), title:"kg added after a clean session", onChange:(e)=>{
        const v = parseFloat(e.target.value); if(!isNaN(v) && v>0){ sp.inc[k]=v; saveStore(); } }});
      sec.appendChild(el("div",{class:"spCfgRow"},[ nameIn, nextIn, incIn, el("span",{class:"spCfgUnit mono"},[ ex.kind==="perSide" ? "/side" : "kg" ]) ]));
    });
  });

  sec.appendChild(el("label",{class:"lbl", style:"margin-top:12px;"},["Trainer's rules"]));
  [
    "Hit every set at the target reps → the weight goes up by the step next time. Miss reps → the weight holds. Miss twice in a row → drop about 10%.",
    "Stop each set 1–2 reps before failure, especially on squats — you train legs daily, so recovery is the limit, not effort.",
    "Every 5th or 6th week, take a deload week: same exercises, about 10% lighter, half the sets.",
    "If both legs feel flat two days running, do the Smith squat and skip the second leg machine that day.",
  ].forEach(t=>{ sec.appendChild(el("div",{class:"spNote"},["• "+t])); });

  main.appendChild(sec);
  main.appendChild(el("div",{style:"border-top:1px solid var(--surface-alt); margin:6px 0 12px;"}));
  main.appendChild(el("div",{class:"lbl"},["App settings (shared by 5×5 and Split)"]));
}

/* ---------------- top-level render ---------------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  const lang = state.settings.lang;

  const header = el("header");
  const row = el("div",{class:"row"});
  row.appendChild(el("h1",null,[ icon("dumbbell",18), t("appName",lang), el("span",{class:"versionBadge"},["v"+APP_VERSION]) ]));
  header.appendChild(row);
  header.appendChild(el("div",{class:"modeRow"},[
    el("button",{class:"modeBtn"+(ui.mode==="5x5"?" active":""), type:"button", onClick:()=>switchMode("5x5")},["5×5"]),
    el("button",{class:"modeBtn"+(ui.mode==="split"?" active":""), type:"button", onClick:()=>switchMode("split")},["Split"]),
  ]));
  header.appendChild(el("p",{class:"tag"},[t("tagline",lang)]));
  if(window._ironLogUpdateAvailable){
    const upBanner = el("div",{class:"updateBanner", onClick:()=>{ window.location.reload(); }},[
      lang==="en" ? "⟳ Update available — tap to refresh" : "⟳ Pembaruan tersedia — ketuk untuk muat ulang"
    ]);
    header.appendChild(upBanner);
  }
  app.appendChild(header);

  const main = el("main",{id:"mainContent"});
  if(ui.mode==="split"){
    if(ui.tab==="log") ui.tab = "today";
    if(ui.tab==="today") renderSplitToday(main);
    else if(ui.tab==="progress") renderSplitProgress(main);
    else if(ui.tab==="history") renderSplitHistory(main);
    else if(ui.tab==="measurements") renderMeasurements(main);
    else if(ui.tab==="settings"){ renderSplitSettings(main); renderSettings(main); }
  } else
  if(ui.tab==="today") renderToday(main);
  else if(ui.tab==="log") renderLog(main);
  else if(ui.tab==="progress") renderProgress(main);
  else if(ui.tab==="history") renderHistory(main);
  else if(ui.tab==="measurements") renderMeasurements(main);
  else if(ui.tab==="settings") renderSettings(main);
  app.appendChild(main);

  const nav = el("nav");
  const inner = el("div",{class:"inner"});
  if(ui.mode==="split") inner.style.gridTemplateColumns = "repeat(5,1fr)";
  [
    {key:"today", i:"flame", label:t("today",lang)},
    {key:"log", i:"plus", label:t("log",lang)},
    {key:"progress", i:"trend", label:t("progress",lang)},
    {key:"history", i:"history", label:t("history",lang)},
    {key:"measurements", i:"ruler", label: lang==="en"?"Body":"Tubuh"},
    {key:"settings", i:"settings", label:t("settings",lang)},
  ].filter(item=> ui.mode!=="split" || item.key!=="log").forEach(item=>{
    const btn = el("button",{class: ui.tab===item.key?"active":"", onClick:()=>{
      if(item.key!=="log") ui.logDraft=null;
      if(item.key!=="today" && window._ironLogClockInterval){ clearInterval(window._ironLogClockInterval); window._ironLogClockInterval=null; }
      ui.tab=item.key; render();
    }},[ icon(item.i,18), el("span",null,[item.label]) ]);
    inner.appendChild(btn);
  });
  nav.appendChild(inner);
  app.appendChild(nav);

  if(ui.tab==="today"){
    requestAnimationFrame(fitTodayToScreen);
  }
}

function fitTodayToScreen(){
  // Measures the ACTUAL rendered height of Today's content against the real
  // available viewport space, and shrinks it just enough to guarantee it
  // never scrolls — instead of guessing pixel values per device by hand.
  const main = document.getElementById("mainContent");
  if(!main) return;
  main.style.transform = "none";
  main.style.height = "auto";
  main.style.width = "100%";

  const header = document.querySelector("header");
  const nav = document.querySelector("nav");
  const headerH = header ? header.getBoundingClientRect().height : 0;
  const navH = nav ? nav.getBoundingClientRect().height : 0;
  const available = window.innerHeight - headerH - navH - 4; // small safety margin
  const natural = main.scrollHeight;

  if(natural > available && available > 100){
    const scale = Math.max(0.55, available / natural); // never shrink below 55% — stays legible
    main.style.transformOrigin = "top center";
    main.style.transform = `scale(${scale})`;
    main.style.width = (100/scale) + "%";
    main.style.marginLeft = `-${(100/scale - 100)/2}%`;
    main.style.height = (natural*scale) + "px";
  }
}
window.addEventListener("resize", ()=>{ if(ui.tab==="today") fitTodayToScreen(); });

function releasePeek(){
  if(ui.peekingTomorrow && typeof ui._exitPeek==="function"){ ui._exitPeek(); }
}
document.addEventListener("pointerup", releasePeek);
document.addEventListener("pointercancel", releasePeek);
document.addEventListener("touchend", releasePeek);
document.addEventListener("touchcancel", releasePeek);
document.addEventListener("mouseup", releasePeek);

render();
pullFromRemote();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(refreshing) return;
    // A new version has taken over. Don't yank the page out from under the
    // user mid-action — just flag it, and let them tap the banner to refresh
    // whenever suits them.
    window._ironLogUpdateAvailable = true;
    refreshing = true;
    render();
  });
}
