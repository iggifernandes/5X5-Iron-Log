<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IRON LOG</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0a09; --surface:#1c1917; --surface-alt:#292524; --border:#3a3532;
    --text:#e7e2d8; --text-dim:#9c9691; --text-faint:#6b6560;
    --accent:#b23a2e; --accent-bright:#e11d48; --amber:#f5e6c8;
    --emerald:#34d399; --amberflag:#fbbf24;
  }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'SF Mono',Menlo,Consolas,monospace;}
  #app{max-width:440px; margin:0 auto; min-height:100vh; padding-bottom:52px; position:relative;}
  header{
    position:sticky; top:0; z-index:10; background:rgba(12,10,9,0.95);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--surface-alt);
    padding:6px 12px 5px;
  }
  header .row{display:flex; align-items:center; justify-content:space-between;}
  header h1{
    font-size:13px; font-weight:900; letter-spacing:0.1em; color:var(--amber);
    margin:0; display:flex; align-items:center; gap:5px;
  }
  header h1 svg{color:var(--accent-bright); width:14px; height:14px;}
  .versionBadge{
    font-size:8px; color:var(--text-faint); font-family:'SF Mono',monospace; font-weight:600;
    letter-spacing:0.02em; margin-left:2px; align-self:flex-end;
  }
  .updateBanner{
    background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.4); color:#7fe8a8;
    font-size:11px; font-weight:700; text-align:center; padding:6px; border-radius:6px;
    margin-top:5px; cursor:pointer; font-family:'SF Mono',monospace;
  }
  header p.tag{display:none;}
  #langBtn{
    display:flex; align-items:center; gap:4px; font-size:9px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--text-faint); border:1px solid var(--surface-alt);
    border-radius:5px; padding:3px 7px; background:none; cursor:pointer;
  }
  #langBtn:hover{border-color:var(--text-faint); color:var(--text-dim);}
  main{padding:6px 10px 2px;}
  nav{
    position:fixed; bottom:0; left:0; right:0; background:rgba(12,10,9,0.97);
    backdrop-filter:blur(8px); border-top:1px solid var(--surface-alt); z-index:10;
  }
  nav .inner{max-width:440px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr);}
  nav button{
    display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 0;
    background:none; border:none; color:var(--text-faint); cursor:pointer;
  }
  nav button.active{color:var(--accent-bright);}
  nav button span{font-size:7.5px; text-transform:uppercase; letter-spacing:0.06em; font-family:'SF Mono',monospace;}

  .banner{
    background:rgba(245,158,11,0.06); border:1px solid rgba(245,158,11,0.25);
    border-radius:6px; padding:5px 8px; font-size:10px; color:#e7cf9a; line-height:1.3; margin-bottom:6px;
  }
  .eyebrow{display:flex; align-items:center; gap:6px; margin-bottom:4px;}
  .eyebrow input[type=date]{
    background:var(--surface); border:1px solid var(--surface-alt); border-radius:5px;
    padding:2px 6px; color:var(--text-dim); font-family:'SF Mono',monospace; font-size:11px;
  }
  .eyebrow .dot{width:5px; height:5px; border-radius:50%; background:var(--accent-bright);}
  .eyebrow span{font-size:10px; text-transform:uppercase; letter-spacing:0.16em; color:var(--text-faint); font-family:'SF Mono',monospace;}
  .bigTitle{font-size:21px; font-weight:900; letter-spacing:-0.02em; color:var(--amber); margin-bottom:8px;}

  .colHeaderRow{display:flex; align-items:center; justify-content:space-between; gap:6px; padding-bottom:4px; border-bottom:1px solid var(--surface-alt); margin-bottom:2px;}
  .colHeaderRow span{font-size:9px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-faint); font-family:'SF Mono',monospace;}
  .colHeaderRow .chWorkout{width:72px; flex-shrink:0;}
  .colHeaderRow .chCol{flex:1; text-align:center;}
  .colHeaderRow .chCol.right{text-align:right;}
  .liftRowCompact{display:flex; align-items:flex-start; justify-content:space-between; gap:6px; padding:5px 0; border-bottom:1px solid var(--surface-alt);}
  .liftRowCompact .lname{font-size:11px; font-weight:600; color:var(--text-dim); white-space:normal; line-height:1.25; word-break:break-word;}
  .lnameWrap{width:72px; flex-shrink:0;}
  .lnameWrapShort{width:34px; flex-shrink:0;}
  .liftRowCompact .lcol{flex:1; display:flex; flex-direction:column; align-items:center;}
  .liftRowCompact .lcol.right{align-items:flex-end;}
  .liftRowCompact .lcol .clbl{font-size:8px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-faint); font-family:'SF Mono',monospace; margin-bottom:1px;}
  .liftRowCompact .lval{font-family:'Doto','SF Mono',monospace; font-size:23px; font-weight:800; color:var(--amber); letter-spacing:0.02em; line-height:1;}
  .liftRowCompact .lval.small{font-size:17px; color:var(--text-dim); font-weight:800;}
  .setsTag{font-size:9px; color:var(--text-faint); font-family:'SF Mono',monospace; letter-spacing:0.04em;}
  .editableVal{
    font-family:'Doto','SF Mono',monospace; font-weight:800; color:var(--amber); letter-spacing:0.02em;
    background:rgba(178,58,46,0.08); border:1px solid rgba(178,58,46,0.4); border-radius:5px;
    text-align:center; width:64px; font-size:23px; padding:1px 2px;
  }
  .editableVal.small{font-size:17px; color:var(--text-dim); width:46px; font-weight:800; background:var(--surface); border-color:var(--surface-alt); padding:1px;}
  .stepperGroup{display:flex; align-items:center; gap:3px;}
  .stepBtn{
    width:20px; height:20px; flex-shrink:0; border-radius:5px; border:1px solid var(--surface-alt);
    background:var(--surface); color:var(--text-dim); font-family:'SF Mono',monospace; font-size:13px;
    font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:1;
    padding:0;
  }
  .stepBtn:active{background:var(--accent); color:#fde8e4; border-color:var(--accent);}
  .setsRepsRow{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 0 8px 0; border-bottom:1px solid var(--surface-alt); margin-bottom:2px;}
  .srGroup{display:flex; align-items:center; gap:4px;}
  .srLbl{font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); font-family:'SF Mono',monospace; margin-right:2px;}
  .srVal{font-size:13px; font-weight:800; color:var(--text-dim); width:16px; text-align:center;}
  .srStatus{font-size:9px; text-transform:uppercase; letter-spacing:0.06em; font-family:'SF Mono',monospace; padding:2px 6px; border-radius:4px;}
  .srStatus.clean{color:var(--emerald); background:rgba(52,211,153,0.12);}
  .srStatus.missed{color:var(--amberflag); background:rgba(251,191,36,0.12);}
  .srStatus.skipped{color:var(--text-faint); background:var(--surface-alt);}
  .sheetTabRow{display:flex; gap:2px; margin-bottom:0;}
  .sheetTab{
    flex:1; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--surface-alt); border-bottom:none;
    border-radius:5px 5px 0 0; padding:5px 4px; cursor:pointer;
    font-family:'SF Mono',monospace; font-size:11px; font-weight:800; color:var(--text-faint);
    letter-spacing:0.06em; text-transform:uppercase;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  .sheetTab.active{background:var(--surface-alt); color:var(--amber); border-color:var(--accent);}
  .sheetTab.peeking{background:rgba(178,58,46,0.18); border-color:var(--accent-bright); color:#f4b8ae;}
  .todayContent{border-top:1px solid var(--surface-alt); padding-top:4px;}
  .resetBtn{
    background:none; border:1px solid var(--surface-alt); color:var(--text-faint);
    font-family:'SF Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.05em;
    padding:3px 7px; border-radius:5px; cursor:pointer;
  }
  .resetBtn:active{border-color:var(--accent); color:#f4b8ae;}
  .disabledBtn{opacity:0.45; cursor:default; pointer-events:none;}
  .logChoiceRow{display:flex; gap:14px; justify-content:center; padding:20px 0;}
  .logChoiceSquare{
    width:130px; height:130px; border-radius:12px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font-family:'SF Mono',monospace; background:var(--surface); border:2px solid var(--surface-alt);
  }
  .logChoiceSquare .lcsType{font-size:34px; font-weight:900; letter-spacing:0.02em;}
  .logChoiceSquare .lcsTag{font-size:10px; text-transform:uppercase; letter-spacing:0.12em; font-weight:700;}
  .logChoiceSquare.glowing{
    background:#0a1f0f; border-color:#34d399; color:#7fff8a;
    box-shadow:0 0 10px rgba(52,211,153,0.55), 0 0 24px rgba(52,211,153,0.35), inset 0 0 14px rgba(52,211,153,0.15);
  }
  .logChoiceSquare.glowing .lcsTag{color:#a8f5c0;}
  .logChoiceSquare.dim{
    background:var(--surface); border-color:rgba(144,238,170,0.25); color:#9fd9ad;
  }
  .logChoiceSquare.dim .lcsTag{color:#6f9a7a;}
  .digitalClock{
    display:block; width:100%; margin-top:10px;
  }
  .digitalClock .clockFace{
    display:block; width:100%; box-sizing:border-box; background:#020402; border-radius:6px;
    padding:10px 10px; font-family:'Doto', 'Courier New', 'SF Mono', monospace; font-weight:800;
    font-size:clamp(32px, 13vw, 54px); text-align:center;
    letter-spacing:0.08em; color:#39ff4a;
  }
  .restRow{display:flex; gap:6px; align-items:stretch; margin-top:6px;}
  .actionRow{display:flex; gap:6px; align-items:stretch; margin-top:8px;}
  .actionRow .dateBtn{
    flex:0 0 auto; width:78px; background:var(--surface); border:1px solid var(--surface-alt);
    border-radius:8px; color:var(--text-dim); font-family:'SF Mono',monospace; font-size:12px;
    padding:0 4px; text-align:center;
  }
  .actionRow .actionMiddle{flex:2; margin:0;}
  .actionRow .actionSide{flex:1; margin:0; width:auto; padding:10px 4px; font-size:12px;}
  .restRow input[type=date]{
    background:var(--surface); border:1px solid var(--surface-alt); border-radius:6px;
    padding:0 10px; color:var(--text-dim); font-family:'SF Mono',monospace; font-size:15px;
  }
  .restRow .btn{width:auto;}

  /* Today page — a clean type scale (10/14/15/18/22/24), calibrated for a ~14cm-tall screen.
     10=micro labels, 14=exercise name/buttons, 15=date/utility, 18=total (de-emphasized),
     22=workout title, 24=per-side (the number you actually read to load the bar). */
  .todayContent .bigTitle{font-size:34px; margin-bottom:6px;}
  .todayContent .eyebrow{margin-top:4px !important; margin-bottom:4px;}
  .todayContent .colHeaderRow{padding-bottom:3px; margin-bottom:1px;}
  .todayContent .colHeaderRow span{font-size:10px;}
  .todayContent .liftRowCompact{padding:6px 0;}
  .todayContent .lnameWrapShort{width:56px;}
  .todayContent .lname{font-size:14px;}
  .todayContent .lval{font-size:18px !important; font-weight:400 !important;}
  .todayContent .lval.small{font-size:24px !important; font-weight:800 !important;}
  .todayContent .editableVal{width:62px; font-size:18px !important; font-weight:400 !important; padding:3px;}
  .todayContent .editableVal.small{width:90px; font-size:24px !important; font-weight:800 !important; padding:4px;}
  .todayContent .stepBtn{width:26px; height:26px; font-size:15px !important;}
  .todayContent .colHeaderRow .chWorkout{width:56px;}
  .todayContent .extraItem{padding:4px 0; font-size:14px !important;}
  .todayContent .btn{padding:12px; font-size:14px !important;}
  .todayContent .lbl{margin-top:5px !important; margin-bottom:2px !important; font-size:10px !important;}
  .peekHint{font-size:10px; color:var(--text-faint); text-align:center; margin-top:8px; font-style:italic;}
  .liftHead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1px;}
  .liftHead .name{font-size:11px; font-weight:600; color:var(--text-dim);}
  .liftHead .meta{font-size:9px; color:var(--text-faint); font-family:'SF Mono',monospace;}

  .diagram{background:rgba(0,0,0,0.3); border:1px solid var(--surface-alt); border-radius:6px; padding:5px 7px;}
  .diagram .topRow{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0;}
  .diagram .totalVal{font-family:'SF Mono',monospace; font-size:16px; font-weight:800; color:var(--amber);}
  .diagram .totalVal small{font-size:10px; color:var(--text-faint); font-weight:400;}
  .barbellWrap{display:flex; justify-content:center; padding:0;}
  .plateRow{display:flex; align-items:center; gap:3px; flex-wrap:wrap; margin-top:3px;}
  .plateRow .lbl{font-size:8px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-faint); font-family:'SF Mono',monospace; margin-right:2px; width:34px; flex-shrink:0;}
  .plate{
    display:inline-flex; align-items:center; justify-content:center; height:19px; min-width:19px; padding:0 4px;
    font-family:'SF Mono',monospace; font-size:10px; font-weight:700; border-radius:3px;
  }
  .plate.gym{background:var(--surface-alt); color:var(--text-dim);}
  .plate.micro{background:rgba(178,58,46,0.25); color:#f4b8ae; border:1px solid rgba(178,58,46,0.6);}
  .editRow{display:flex; align-items:center; justify-content:space-between; margin-bottom:3px;}
  .editBtn{
    display:flex; align-items:center; gap:4px; background:none; border:1px solid var(--surface-alt);
    color:var(--text-faint); font-family:'SF Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; padding:4px 8px; border-radius:5px; cursor:pointer;
  }
  .editBtn.editing{border-color:var(--accent); color:#f4b8ae;}
  .editBtn.changed{border-color:var(--emerald); color:var(--emerald);}
  .addExerciseCard{border:1px dashed var(--surface-alt); border-radius:8px; padding:10px; margin-bottom:10px;}
  .addExerciseCard input, .addExerciseCard textarea, .addExerciseCard select{
    width:100%; background:var(--bg); border:1px solid var(--surface-alt); border-radius:6px;
    padding:7px 6px; color:var(--text); font-size:11px; margin-bottom:6px; font-family:inherit; min-width:0;
  }
  .addExerciseCard select{appearance:none; -webkit-appearance:none;}
  .extraItem{display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:6px 0; border-top:1px solid var(--surface-alt);}
  .extraItem .del{color:var(--text-faint); cursor:pointer; font-size:11px;}
  .energyRow{display:flex; gap:4px; margin-bottom:10px;}
  .energyBtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--surface); border:1px solid var(--surface-alt); border-radius:6px;
    padding:7px 2px; cursor:pointer; color:var(--text-faint);
    font-family:'SF Mono',monospace; font-size:13px; font-weight:800;
  }
  .energyBtn .energyLbl{font-size:8px; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;}
  .energyBtn.active{background:rgba(178,58,46,0.2); border-color:var(--accent); color:#f4b8ae;}
  .weekSummaryCard{border:1px solid var(--emerald); background:rgba(52,211,153,0.06); border-radius:8px; padding:12px; margin-bottom:14px;}
  .clbl{font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); font-family:'SF Mono',monospace;}
  .streakBadge{
    display:inline-block; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.35);
    color:#e7cf9a; font-family:'SF Mono',monospace; font-size:10px; font-weight:700;
    padding:3px 9px; border-radius:20px; margin-bottom:5px;
  }
  .stallBanner{
    background:rgba(178,58,46,0.1); border:1px solid rgba(178,58,46,0.4); color:#f4b8ae;
    font-size:10px; line-height:1.35; padding:6px 8px; border-radius:5px; margin-bottom:5px;
  }
  .prBadge{
    display:inline-flex; align-items:center; gap:2px; font-size:9px; font-weight:800;
    color:#f5e6c8; background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.4);
    padding:1px 6px; border-radius:10px; margin-left:6px; font-family:'SF Mono',monospace;
  }

  .btn{
    width:100%; border:none; border-radius:8px; font-family:'SF Mono',monospace;
    font-weight:700; text-transform:uppercase; letter-spacing:0.12em; font-size:13px;
    padding:14px; cursor:pointer; transition:background 0.15s;
  }
  .btn-primary{background:var(--accent); color:#fde8e4;}
  .btn-primary:hover{background:var(--accent-bright);}
  .btn-ghost{background:none; border:1px solid var(--surface-alt); color:var(--text-faint); font-size:11px; padding:11px;}
  .linkBtn{
    display:block; width:100%; text-align:center; background:none; border:none;
    color:var(--text-faint); font-family:'SF Mono',monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:0.1em; padding:6px 0; cursor:pointer;
  }
  .linkBtn:hover{color:var(--text-dim);}

  .card{border:1px solid var(--surface-alt); border-radius:7px; padding:7px 8px; background:rgba(41,37,36,0.3); margin-bottom:6px;}
  .card .head{display:flex; justify-content:space-between; align-items:center; margin-bottom:3px;}
  .card .head .name{font-weight:600; font-size:11px; color:var(--text-dim);}
  .card .head .meta{font-size:9px; color:var(--text-faint); font-family:'SF Mono',monospace;}
  .weightInput{
    display:flex; align-items:center; gap:6px; margin-bottom:4px;
  }
  .weightInput input{
    width:74px; background:var(--bg); border:1px solid var(--surface-alt); border-radius:5px;
    padding:5px 8px; color:var(--amber); font-family:'SF Mono',monospace; font-size:11px;
  }
  .weightInput span{font-size:10px; color:var(--text-faint); font-family:'SF Mono',monospace;}
  .statusRow{display:flex; gap:4px; margin-top:3px;}
  .statusBtn{
    flex:1; font-size:9px; text-transform:uppercase; letter-spacing:0.03em; padding:5px 0;
    border-radius:5px; border:1px solid var(--surface-alt); background:none; color:var(--text-faint);
    font-family:'SF Mono',monospace; cursor:pointer;
  }
  .statusBtn.sel-clean{background:rgba(52,211,153,0.15); border-color:#22946b; color:var(--emerald);}
  .statusBtn.sel-missed{background:rgba(251,191,36,0.15); border-color:#a3781c; color:var(--amberflag);}
  .statusBtn.sel-skipped{background:var(--surface-alt); border-color:var(--text-faint); color:var(--text-dim);}

  .dateRow{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .dateRow input[type=date]{
    background:var(--surface); border:1px solid var(--surface-alt); border-radius:6px;
    padding:6px 8px; color:var(--text-dim); font-family:'SF Mono',monospace; font-size:11px;
  }
  textarea{
    width:100%; background:var(--surface); border:1px solid var(--surface-alt); border-radius:6px;
    padding:10px; color:var(--text-dim); font-size:13px; resize:vertical; font-family:inherit;
  }
  label.lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.15em; color:var(--text-faint); font-family:'SF Mono',monospace; display:block; margin-bottom:6px;}

  .chip{
    font-size:10px; text-transform:uppercase; letter-spacing:0.05em; padding:6px 10px;
    border-radius:6px; border:1px solid var(--surface-alt); color:var(--text-faint);
    font-family:'SF Mono',monospace; cursor:pointer; background:none;
  }
  .chip.active{background:rgba(178,58,46,0.2); border-color:var(--accent); color:#f4b8ae;}
  .chipRow{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;}

  .chartBox{border:1px solid var(--surface-alt); border-radius:7px; padding:8px; background:rgba(41,37,36,0.3);}
  .emptyState{text-align:center; color:var(--text-faint); font-size:11px; font-family:'SF Mono',monospace; padding:40px 16px;}

  .histItem{border:1px solid var(--surface-alt); border-radius:7px; overflow:hidden; margin-bottom:6px;}
  .histHead{
    width:100%; display:flex; justify-content:space-between; align-items:center; padding:9px 10px;
    background:rgba(41,37,36,0.3); border:none; cursor:pointer; color:inherit;
  }
  .histHead .left{display:flex; align-items:center; gap:10px;}
  .histHead .wtype{font-family:'SF Mono',monospace; font-weight:800; font-size:13px; color:var(--amber);}
  .histHead .wdate{font-size:11px; color:var(--text-faint); font-family:'SF Mono',monospace;}
  .histBody{padding:0 12px 12px; border-top:1px solid var(--surface-alt);}
  .histRow{display:flex; justify-content:space-between; font-size:11px; padding:6px 0;}
  .histRow .lname{color:var(--text-faint);}
  .histRow .rval{font-family:'SF Mono',monospace; color:var(--amber);}
  .histRow .flag-missed{color:var(--amberflag); font-size:10px; font-family:'SF Mono',monospace;}

function t(k,lang){ return DICT[k] ? DICT[k][lang] : k; }

function decompose(target, plates){
  let remaining = Math.round(target*100)/100;
  const used = [];
  for(const p of plates){
    while(remaining >= p - 1e-6){ used.push(p); remaining -= p; remaining = Math.round(remaining*100)/100; }
  }
  return {pieces:used, remainder:remaining};
}
function todayLocal(){
  // Uses the device's LOCAL date, not UTC — toISOString() alone shifts to the
  // previous calendar day during early morning hours in timezones ahead of UTC
  // (e.g. WIB, UTC+7), which was blocking correct date entry/editing.
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${yyyy}-${mm}-${dd}`;
}

function fmt(n){
  if(n===undefined||n===null||isNaN(n)) return "-";
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
}
function computeLoad(lift, value){
  if(lift.kind==="perSide"){
    const gym = decompose(value, GYM_PLATES);
    const micro = decompose(gym.remainder, MICRO_PLATES);
    return {gymPieces:gym.pieces, microPieces:micro.pieces, total:BAR+value*2, sideValue:value};
  }
  if(lift.kind==="total"){
    const plateSide = (value-BAR)/2;
    const gym = decompose(plateSide, GYM_PLATES);
    const micro = decompose(gym.remainder, MICRO_PLATES);
    return {gymPieces:gym.pieces, microPieces:micro.pieces, total:value, sideValue:plateSide};
  }
  const gym = decompose(value, GYM_PLATES);
  const micro = decompose(gym.remainder, MICRO_PLATES);
  return {gymPieces:gym.pieces, microPieces:micro.pieces, total:value, sideValue:value};
}

/* ---------------- persistence ---------------- */
const STORE_KEY = "ironlog_v1";
// Reconstructed from chat history — the post-restart "patient pace" phase,
// where every session's numbers were explicitly confirmed. Dates are

  {date:"2026-08-07", type:"A", lifts:{dfs:6.5,  sq:27.5, bp:19.25, rw:16}},
  {date:"2026-08-08", type:"B", lifts:{dfs:6.75, ohp:6,   sq:28,  dl:27}},
  {date:"2026-08-09", type:"A", lifts:{dfs:7,    sq:28.5, bp:19.75, rw:16.25}},
  {date:"2026-08-10", type:"B", lifts:{dfs:7.25, ohp:6.25, sq:29, dl:27.5, curl:0.25, tricep:0.25}},
  {date:"2026-08-11", type:"A", lifts:{dfs:7.5,  sq:29.5, bp:20, rw:16.5, curl:0.5, tricep:0.5}, extra:[{name:"Weighted Pull-ups", detail:"2.5kg"}]},
  {date:"2026-08-12", type:"B", lifts:{dfs:7.75, ohp:6.5, sq:30, dl:28, curl:0.75, tricep:1}, extra:[{name:"Weighted Pull-ups", detail:"3kg"}]},
  {date:"2026-08-13", type:"A", lifts:{dfs:8,    sq:30.5, bp:20.5, rw:16.75, curl:1, tricep:2}},
  {date:"2026-08-14", type:"B", lifts:{dfs:8.25, ohp:6.75, sq:31, dl:28.5, curl:1.25, tricep:2.5}},
].map((s,i)=>{
  const lifts = {};
  Object.entries(s.lifts).forEach(([k,v])=>{ lifts[k] = {value:v, status:"clean"}; });
  return {id:"seed"+i, date:s.date, type:s.type, notes:"", extra:s.extra||[], lifts};
});

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    settings:{
      lang:"en", current:{...DEFAULT_CURRENT},
      increments:Object.fromEntries(Object.values(LIFTS).map(l=>[l.key,l.inc])),
      lastWorkoutType:"B", onHold:{}
    },
    plannedSession:null,
    painLog:[],
    measurements:[],
    sessions:[...SEEDED_SESSIONS].reverse()
  };
}
function saveStore(){
  state._lastLocalChange = new Date().toISOString();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  queueRemotePush();
}
// Used ONLY for one-time schema migrations at load time. These must never look
// like a real, timestamped user change — otherwise a device that's simply
// running an older local copy can wrongly appear "more recent" than a sheet
// that actually has newer data from another device, and clobber it on push.
function saveStoreLocalOnly(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ---------------- Google Sheets sync ---------------- */
const SYNC_URL = "https://script.google.com/macros/s/AKfycby5gfyDxkdQcxjlB8XxBIz5RXP0mq7uCezV9py_orqhuabw2ADJ-xOBl2HMEVt46SvR/exec";
let syncStatus = "idle"; // idle | syncing | synced | error | offline
let _pushTimer = null;

function setSyncStatus(s){
  syncStatus = s;
  const el = document.getElementById("syncIndicator");
  if(el) el.textContent = syncStatusLabel(s);
}
function syncStatusLabel(s){
  const lang = (state && state.settings && state.settings.lang) || "en";
  const map = {
    idle: lang==="en" ? "Not synced yet" : "Belum sinkron",
    syncing: lang==="en" ? "Syncing…" : "Menyinkronkan…",
    synced: lang==="en" ? "Synced" : "Tersinkron",
    error: lang==="en" ? "Sync failed" : "Sinkron gagal",
  };
  return map[s] || s;
}

function queueRemotePush(){
  if(_pushTimer) clearTimeout(_pushTimer);
  _pushTimer = setTimeout(pushToRemote, 900); // debounce rapid successive saves
}

async function pushToRemote(){
  try{
    setSyncStatus("syncing");
    await fetch(SYNC_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight Apps Script can't handle
      body: JSON.stringify({ state: JSON.stringify(state) }),
    });
    setSyncStatus("synced");
  }catch(e){
    setSyncStatus("error");
  }
}

async function pullFromRemote(){
  try{
    setSyncStatus("syncing");
    const res = await fetch(SYNC_URL, { method:"GET" });
    const data = await res.json();
    if(!data || !data.state) { setSyncStatus("synced"); return; }
    const remoteUpdatedAt = data.updatedAt;
    const localUpdatedAt = state._lastLocalChange;
    const remoteIsNewer = remoteUpdatedAt && (!localUpdatedAt || new Date(remoteUpdatedAt) > new Date(localUpdatedAt));
    if(remoteIsNewer){
      const remoteState = JSON.parse(data.state);
      remoteState._lastLocalChange = remoteUpdatedAt;
      state = remoteState;
      if(state.plannedSession===undefined) state.plannedSession = null;
      if(state.painLog===undefined) state.painLog = [];
      if(state.measurements===undefined) state.measurements = [];
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
      setSyncStatus("synced");
      render();
    } else {
      setSyncStatus("synced");
      pushToRemote(); // make sure remote has our (equally or more current) copy
    }
  }catch(e){
    setSyncStatus("error");
  }
}

let state = loadStore();
if(state.plannedSession === undefined) state.plannedSession = null;
if(state.painLog === undefined) state.painLog = [];
if(state.measurements === undefined) state.measurements = [];

    state.sessions = [

        lifts:{
          dfs:{value:8.25, status:"clean"}, ohp:{value:6.75, status:"clean"},
          sq:{value:31, status:"clean"}, dl:{value:28.5, status:"clean"},

}
if(!state.settings.curlPerSideMigrated){

  state.settings.current.curl = 0.25;

}

  state.settings.current.tricep = 0.25;

  state.settings.tricepPerSideMigrated = true;
  saveStoreLocalOnly();
}
const EXERCISE_OPTIONS = ["Weighted Pull-ups","Side Bends","Cable Crunches","Leg Rise","Dips","Calf Press (Cream)","Calf Press (Cone)"];

let ui = { tab:"today", logDraft:null, progressLift:"sq", expandedSession:null, confirmDeleteId:null, todayOverrides:{}, todayExtras:null, peekingTomorrow:false, editingSessionId:null, restDayDate:null, historySortDir:"desc", resetConfirming:false };

/* ---------------- render helpers ---------------- */
function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(k==="html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function icon(name, size){
  size = size||16;
  const icons = {
    dumbbell:'<path d="M6.5 6.5 17.5 17.5M4.5 4.5l3 3M16.5 16.5l3 3M2 2l3.5 3.5M18.5 18.5 22 22M3 8l2-2M19 16l2-2M8 3l-2 2M16 19l-2 2M9 6l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
    plus:'<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>',
    trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    history:'<path d="M3 3v5h5M3.05 13A9 9 0 1 0 6 5.3L3 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    settings:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.5" fill="none"/>',
    flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    globe:'<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke="currentColor" stroke-width="1.5" fill="none"/>',
    chevronDown:'<path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    check:'<path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    x:'<path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>',
    ruler:'<path d="M3 8h18v8H3z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M7 8v3M11 8v3M15 8v3M19 8v3" stroke="currentColor" stroke-width="1.5"/>',
  };

}

function suggestedValue(key){
  const lift = LIFTS[key];
  const cur = state.settings.current[key] ?? 0;
  if(state.settings.onHold[key]) return cur;
  return Math.round((cur + (state.settings.increments[key] ?? lift.inc))*100)/100;
}

function plateBarEl(pieces, cls, label){
  if(!pieces.length) return null;
  const row = el("div",{class:"plateRow"},[ el("span",{class:"lbl"},[label]) ]);
  pieces.forEach(p=>{
    const w = Math.max(26, 16 + p*3);
    row.appendChild(el("span",{class:"plate "+cls, style:`width:${w}px`},[fmt(p)]));
  });
  return row;
}

function plateColor(p, isMicro){
  return isMicro ? "#e8938a" : "#8a8580";
}
function barbellSvgEl(lift, value){
  const load = computeLoad(lift, value);
  const pieces = [...load.gymPieces.map(p=>({p,micro:false})), ...load.microPieces.map(p=>({p,micro:true}))];
  const W=320, H=76, cx=W/2;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width","100%"); svg.setAttribute("height","46");

  function rect(x,y,w,h,fill,rx){
    const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x",x); r.setAttribute("y",y); r.setAttribute("width",w); r.setAttribute("height",h);
    r.setAttribute("fill",fill); if(rx) r.setAttribute("rx",rx);
    return r;
  }
  function txt(x,y,s,size,fill,anchor,weight){
    const tEl = document.createElementNS("http://www.w3.org/2000/svg","text");
    tEl.setAttribute("x",x); tEl.setAttribute("y",y); tEl.setAttribute("font-size",size);
    tEl.setAttribute("fill",fill); tEl.setAttribute("text-anchor",anchor||"middle");
    tEl.setAttribute("font-family","'SF Mono',monospace"); tEl.setAttribute("font-weight",weight||"700");
    tEl.textContent = s;
    return tEl;
  }

  const collarGap = 34;
  const barY = H/2 - 3;
  // sleeve bar (full width, behind plates)
  svg.appendChild(rect(6, barY, W-12, 6, "#57534e", 2));
  // center collar block
  svg.appendChild(rect(cx-collarGap, barY-7, collarGap*2, 20, "#3f3c39", 3));

  function stackSide(dir){
    let x = cx + dir*collarGap;
    pieces.forEach(({p,micro})=>{
      const thickness = Math.max(4, Math.min(11, 3.2 + p*0.55));
      const radius = Math.max(16, Math.min(30, 11 + p*0.85));
      const y = H/2 - radius/2;
      if(dir>0){ svg.appendChild(rect(x, y, thickness, radius, plateColor(p,micro), 2)); x += thickness+1.2; }
      else { x -= thickness+1.2; svg.appendChild(rect(x, y, thickness, radius, plateColor(p,micro), 2)); }
    });
    return x;
  }
  const rightEnd = stackSide(1);
  const leftEnd = stackSide(-1);
  // sleeve end caps
  svg.appendChild(rect(Math.max(rightEnd,cx+collarGap), barY-6, 5, 18, "#78716c", 1));
  svg.appendChild(rect(Math.min(leftEnd,cx-collarGap)-5, barY-6, 5, 18, "#78716c", 1));

  // center total label
  svg.appendChild(txt(cx, 16, fmt(load.total)+"kg", 13, "#f5e6c8", "middle", "800"));
  // per-side labels
  if(lift.kind!=="added"){
    svg.appendChild(txt(cx-collarGap-14, H-6, fmt(load.sideValue), 10, "#9c9691", "end", "600"));
    svg.appendChild(txt(cx+collarGap+14, H-6, fmt(load.sideValue), 10, "#9c9691", "start", "600"));
  }
  return svg;
}

function miniBarbellSvgEl(lift, value){
  const load = computeLoad(lift, value);
  const pieces = [...load.gymPieces.map(p=>({p,micro:false})), ...load.microPieces.map(p=>({p,micro:true}))];
  const W=130, H=16, cx=W/2;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width","100%"); svg.setAttribute("height","14");
  function rect(x,y,w,h,fill){
    const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x",x); r.setAttribute("y",y); r.setAttribute("width",w); r.setAttribute("height",h);
    r.setAttribute("fill",fill); r.setAttribute("rx",1);
    return r;
  }
  const barY = H/2 - 1;
  svg.appendChild(rect(2, barY, W-4, 2, "#57534e"));
  const collarGap = 14;
  svg.appendChild(rect(cx-collarGap, barY-3, collarGap*2, 8, "#3f3c39"));
  function stackSide(dir){
    let x = cx + dir*collarGap;
    pieces.forEach(({p,micro})=>{
      const thickness = Math.max(1.6, Math.min(4.5, 1.2 + p*0.22));
      const radius = Math.max(6, Math.min(15, 5 + p*0.36));
      const y = H/2 - radius/2;
      if(dir>0){ svg.appendChild(rect(x, y, thickness, radius, micro?"#e8938a":"#8a8580")); x += thickness+0.6; }
      else { x -= thickness+0.6; svg.appendChild(rect(x, y, thickness, radius, micro?"#e8938a":"#8a8580")); }
    });
  }
  if(lift.kind!=="added"){ stackSide(1); stackSide(-1); }
  return svg;
}

function sideEditToStoredValue(lift, newSideVal){
  if(lift.kind==="total"){
    const sv = Math.max(MIN_STEP, newSideVal); // curl/tricep: smallest usable load is 0.25kg/side, not bar-only
    return BAR + sv*2;
  }
  const sv = Math.max(0, newSideVal); // squat/DL/etc can legitimately start at bar-only (0/side)
  return sv;
}

  }
  return wrap;
}

function restLoggedForDate(dateStr){
  return state.sessions.some(s=> s.type==="REST" && s.date===dateStr);
}

function logRestDay(dateStr){
  const d = dateStr || todayLocal();
  if(restLoggedForDate(d)) return; // already logged once for this date — no duplicates
  const record = { id:"rest-"+Date.now(), date:d, type:"REST", notes:"", extra:[], lifts:{} };
  state.sessions = [record, ...state.sessions];
  saveStore();
  ui.todayOverrides = {};
  ui.todayExtras = null;
}

function parseSets(str){
  const parts = str.split(/[×x]/).map(n=>parseInt(n.trim(),10));
  return { sets: parts[0]||5, reps: parts[1]||5 };
}

function startEditSession(session){
  const liftsForType = Object.values(LIFTS).filter(l=>l.workouts.includes(session.type));
  const draft = { date:session.date, type:session.type, notes:session.notes||"", energy:session.energy??null, checklist:{...(session.checklist||{})}, extra:[...(session.extra||[])], lifts:{} };
  liftsForType.forEach(l=>{
    const existing = session.lifts[l.key];
    const defaultPlanned = parseSets(l.sets);
    draft.lifts[l.key] = existing
      ? { value:existing.value, status:existing.status, sets:existing.sets??defaultPlanned.sets, reps:existing.reps??defaultPlanned.reps, plannedSets:existing.plannedSets??defaultPlanned.sets, plannedReps:existing.plannedReps??defaultPlanned.reps }
      : { value:suggestedValue(l.key), status:"clean", sets:defaultPlanned.sets, reps:defaultPlanned.reps, plannedSets:defaultPlanned.sets, plannedReps:defaultPlanned.reps };
  });
  ui.editingSessionId = session.id;
  ui.logDraft = draft;
  ui.tab = "log";
  render();
}

function startLog(type){
  const liftsForType = Object.values(LIFTS).filter(l=>l.workouts.includes(type));
  const plan = state.plannedSession && state.plannedSession.type===type ? state.plannedSession : null;
  const extraSource = ui.todayExtras!==null ? ui.todayExtras : (plan ? (plan.extra||[]) : []);
  const draft = { date:todayLocal(), type, notes: plan?plan.notes||"":"", extra:[...extraSource], lifts:{} };
  liftsForType.forEach(l=>{
    const planned = plan && plan.lifts[l.key];
    const overrideVal = ui.todayOverrides[l.key];
    const value = planned ? planned.value : (overrideVal !== undefined ? overrideVal : suggestedValue(l.key));
    const defaultPlanned = parseSets(l.sets);
    draft.lifts[l.key] = {
      value, status:"clean",
      sets: planned ? planned.sets : defaultPlanned.sets,
      reps: planned ? planned.reps : defaultPlanned.reps,
      plannedSets: defaultPlanned.sets, plannedReps: defaultPlanned.reps
    };
  });
  ui.todayOverrides = {};
  ui.todayExtras = null;
  ui.logDraft = draft;
  ui.tab = "log";
  render();
}

function recomputeStatus(data){
  if(data.sets<=0 || data.reps<=0) data.status = "skipped";
  else if(data.sets>=data.plannedSets && data.reps>=data.plannedReps) data.status = "clean";
  else data.status = "missed";
}

function saveLog(){
  const draft = ui.logDraft;
  const id = Date.now().toString();
  const cleanLifts = {};
  Object.entries(draft.lifts).forEach(([k,d])=>{ cleanLifts[k] = {value:d.value, status:d.status, sets:d.sets, reps:d.reps, plannedSets:d.plannedSets, plannedReps:d.plannedReps}; });
  const record = { id, date:draft.date, type:draft.type, notes:draft.notes, energy:draft.energy??null, checklist:draft.checklist||{}, extra:draft.extra||[], lifts:cleanLifts };
  state.sessions = [record, ...state.sessions];

  const nextCurrent = {...state.settings.current};
  const nextOnHold = {...state.settings.onHold};
  Object.entries(draft.lifts).forEach(([key,data])=>{
    if(data.status==="clean"){ nextCurrent[key]=data.value; nextOnHold[key]=false; }
    else if(data.status==="missed"){ nextCurrent[key]=data.value; nextOnHold[key]=true; }
  });
  state.settings.current = nextCurrent;
  state.settings.onHold = nextOnHold;
  state.settings.lastWorkoutType = draft.type;
  if(state.plannedSession && state.plannedSession.type===draft.type) state.plannedSession = null;

  saveStore();
  ui.logDraft = null;
  ui.tab = "history";
  render();
}

function saveEditedSession(){
  const draft = ui.logDraft;
  const cleanLifts = {};
  Object.entries(draft.lifts).forEach(([k,d])=>{ cleanLifts[k] = {value:d.value, status:d.status, sets:d.sets, reps:d.reps, plannedSets:d.plannedSets, plannedReps:d.plannedReps}; });

  // For each lift touched by this edit, check whether this session is still the MOST RECENT
  // logged record of that lift (searching newest-first, before we mutate anything below).
  // If so, the edit needs to cascade into current progression — otherwise Today would keep
  // showing a stale suggestion built from the old, wrong number.
  const nextCurrent = {...state.settings.current};
  const nextOnHold = {...state.settings.onHold};
  let cascaded = false;
  Object.keys(cleanLifts).forEach(key=>{
    const mostRecentForKey = state.sessions.find(s=> s.lifts && s.lifts[key]);
    if(mostRecentForKey && mostRecentForKey.id===ui.editingSessionId){
      const d = cleanLifts[key];
      if(d.status==="clean"){ nextCurrent[key]=d.value; nextOnHold[key]=false; cascaded=true; }
      else if(d.status==="missed"){ nextCurrent[key]=d.value; nextOnHold[key]=true; cascaded=true; }
    }
  });

  const wasMostRecentSession = state.sessions[0] && state.sessions[0].id===ui.editingSessionId;

  state.sessions = state.sessions.map(s=>
    s.id===ui.editingSessionId
      ? { ...s, date:draft.date, type:draft.type, notes:draft.notes, energy:draft.energy??null, checklist:draft.checklist||{}, extra:draft.extra||[], lifts:cleanLifts }
      : s
  );

  if(cascaded){
    state.settings.current = nextCurrent;
    state.settings.onHold = nextOnHold;
    if(wasMostRecentSession) state.settings.lastWorkoutType = draft.type;
  }

  saveStore();
  ui.editingSessionId = null;
  ui.logDraft = null;
  ui.todayOverrides = {};
  ui.todayExtras = null;
  ui.tab = "history";
  render();
}

function chartSvg(rows){
  const w=380, h=220, padL=34, padR=10, padT=14, padB=24;
  const values = rows.map(r=>r.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const x = i => padL + (i/(rows.length-1)) * (w-padL-padR);
  const y = v => padT + (1 - (v-min)/range) * (h-padT-padB);

  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  svg.setAttribute("width","100%");
  svg.setAttribute("height","240");

  // grid lines
  for(let i=0;i<=3;i++){
    const gy = padT + (i/3)*(h-padT-padB);
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",padL); line.setAttribute("x2",w-padR);
    line.setAttribute("y1",gy); line.setAttribute("y2",gy);
    line.setAttribute("stroke","#292524"); line.setAttribute("stroke-dasharray","3,3");
    svg.appendChild(line);
  }

  const pathD = rows.map((r,i)=> (i===0?"M":"L") + x(i).toFixed(1) + "," + y(r.value).toFixed(1)).join(" ");
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",pathD);
  path.setAttribute("fill","none");
  path.setAttribute("stroke","#e11d48");
  path.setAttribute("stroke-width","2.5");
  svg.appendChild(path);

  rows.forEach((r,i)=>{
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",x(i)); c.setAttribute("cy",y(r.value)); c.setAttribute("r","3.5");
    c.setAttribute("fill","#e11d48");
    svg.appendChild(c);
    if(i===0 || i===rows.length-1 || rows.length<=6){
      const lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
      lbl.setAttribute("x",x(i)); lbl.setAttribute("y",h-6);
      lbl.setAttribute("fill","#78716c"); lbl.setAttribute("font-size","9");
      lbl.setAttribute("text-anchor","middle"); lbl.setAttribute("font-family","monospace");
      lbl.textContent = r.date;
      svg.appendChild(lbl);
    }
  });
  // y-axis min/max labels
  [min,max].forEach(v=>{
    const lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
    lbl.setAttribute("x",4); lbl.setAttribute("y", y(v)+3);
    lbl.setAttribute("fill","#78716c"); lbl.setAttribute("font-size","9"); lbl.setAttribute("font-family","monospace");
    lbl.textContent = fmt(v);
    svg.appendChild(lbl);
  });

  return el("div",{class:"chartBox"},[svg]);
}

function sortedSessions(){
  // Newest-first by actual date, not insertion order — insertion order breaks
  // once a backdated/missed session gets logged after the fact.
  return [...state.sessions].sort((a,b)=> b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
}

function isPR(key, value, beforeSessionId){
  // True if `value` beats every earlier (by date) clean session's value for this lift.
  const ordered = sortedSessions();
  let seenSelf = beforeSessionId===undefined;
  let best = -Infinity;
  for(const s of ordered){
    if(!seenSelf){ if(s.id===beforeSessionId){ seenSelf=true; } continue; }
    const d = s.lifts && s.lifts[key];
    if(d && d.status==="clean" && d.value>best) best = d.value;
  }
  return value > best;
}

function stalledLifts(){
  // A lift counts as stalled if its 2 most recent (by date) logged attempts were both missed.
  const ordered = sortedSessions();
  const stalled = [];
  Object.keys(LIFTS).forEach(key=>{
    const recent = ordered.filter(s=>s.lifts && s.lifts[key]).slice(0,2);
    if(recent.length===2 && recent.every(s=>s.lifts[key].status==="missed")){
      stalled.push(key);
    }
  });
  return stalled;
}

function sessionTonnage(session){
  let total = 0;
  Object.entries(session.lifts||{}).forEach(([key,d])=>{
    const lift = LIFTS[key];
    if(!lift || !d.sets || !d.reps) return;
    const load = computeLoad(lift, d.value);
    total += load.total * d.sets * d.reps;
  });
  return Math.round(total);
}

function currentStreak(){
  // Consecutive calendar days, counting back from the most recent LOGGED DATE (not
  // insertion order), with something logged.
  const days = new Set(state.sessions.map(s=>s.date));
  if(days.size===0) return 0;
  const mostRecentDate = sortedSessions()[0].date;
  let streak = 0;
  let cursor = new Date(mostRecentDate+"T00:00:00");
  while(days.has(`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,"0")}-${String(cursor.getDate()).padStart(2,"0")}`)){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeWeekSummary(endDateStr){
  const end = new Date(endDateStr+"T00:00:00");
  const start = new Date(end); start.setDate(start.getDate()-6);
  const startStr = start.toISOString().slice(0,10);
  const weekSessions = state.sessions.filter(s=> s.date>=startStr && s.date<=endDateStr);
  const workouts = weekSessions.filter(s=>s.type!=="REST").length;
  const rests = weekSessions.filter(s=>s.type==="REST").length;
  const liftChanges = {};
  Object.keys(LIFTS).forEach(key=>{
    const entries = weekSessions.filter(s=>s.lifts && s.lifts[key]).sort((a,b)=> a.date.localeCompare(b.date));
    if(entries.length){
      const first = entries[0].lifts[key].value;
      const last = entries[entries.length-1].lifts[key].value;
      liftChanges[key] = { first, last, delta: Math.round((last-first)*100)/100 };
    }
  });
  const painEntries = (state.painLog||[]).filter(p=> p.date>=startStr && p.date<=endDateStr);
  const energyVals = weekSessions.filter(s=>s.energy).map(s=>s.energy);
  const avgEnergy = energyVals.length ? Math.round((energyVals.reduce((a,b)=>a+b,0)/energyVals.length)*10)/10 : null;
  return { startStr, endDateStr, workouts, rests, liftChanges, painEntries, avgEnergy };
}

        right.appendChild(el("span",{class:"rval"},[fmt(data.value)+"kg"]));
        if(data.status==="clean"){
          const i=icon("check",13); i.style.color="#34d399"; right.appendChild(i);
          if(isPR(key, data.value, s.id)){ right.appendChild(el("span",{class:"prBadge"},[ "🏆 PR" ])); }
        }
        if(data.status==="missed"){ right.appendChild(el("span",{class:"flag-missed"},[t("missed",lang)])); }
        if(data.status==="skipped"){ const i=icon("x",13); i.style.color="#6b6560"; right.appendChild(i); }
        row.appendChild(right);
        body.appendChild(row);
      });
      if(s.type!=="REST"){
        const tonnage = sessionTonnage(s);
        if(tonnage>0){
          body.appendChild(el("div",{class:"histRow"},[
            el("span",{class:"lname"},[lang==="en"?"Volume":"Volume"]),
            el("span",{class:"rval"},[tonnage.toLocaleString()+"kg"])
          ]));
        }
      }
      if(s.checklist && Object.values(s.checklist).some(v=>v)){
        const usedItems = Object.entries(s.checklist).filter(([,v])=>v).map(([k])=>k);
        body.appendChild(el("div",{style:"font-size:10px; color:var(--text-faint); padding:4px 0;"},[ (lang==="en"?"Used: ":"Digunakan: ")+usedItems.join(", ") ]));
      }
      if(s.extra && s.extra.length){
        s.extra.forEach(ex=>{
          body.appendChild(el("div",{class:"histRow"},[
            el("span",{class:"lname"},[ex.name]),
            el("span",{class:"rval", style:"font-size:11px;"},[ex.detail||""])
          ]));
        });
      }
      if(s.energy){
        const lvlNames = {1:lang==="en"?"Drained":"Terkuras",2:lang==="en"?"Low":"Rendah",3:"OK",4:lang==="en"?"Good":"Baik",5:lang==="en"?"Strong":"Kuat"};
        body.appendChild(el("div",{class:"histRow"},[
          el("span",{class:"lname"},[lang==="en"?"Energy":"Energi"]),
          el("span",{class:"rval"},[`${s.energy}/5 · ${lvlNames[s.energy]||""}`])
        ]));
      }
      if(s.notes){ body.appendChild(el("p",{style:"font-size:11px; color:var(--text-faint); font-style:italic; padding-top:4px;"},[s.notes])); }
      const delRow = el("div",{class:"delRow"});
      if(s.type!=="REST"){
        delRow.appendChild(el("a",{onClick:()=>{ startEditSession(s); }},[t("edit",lang)]));
      }
      if(ui.confirmDeleteId===s.id){
        const pwLbl = lang==="en" ? "Enter password to delete" : "Masukkan kata sandi untuk hapus";
        const wrongLbl = lang==="en" ? "Wrong password" : "Kata sandi salah";
        const pwInput = el("input",{type:"password", placeholder:pwLbl, style:"width:110px; background:var(--bg); border:1px solid var(--surface-alt); border-radius:5px; padding:4px 7px; color:var(--text); font-size:11px; margin-right:6px;"});
        const errSpan = el("span",{style:"font-size:10px; color:#f4a5a5; display:none; margin-right:6px;"},[wrongLbl]);
        const doDelete = ()=>{
          if(pwInput.value === DELETE_PASSWORD){
            state.sessions = state.sessions.filter(x=>x.id!==s.id);
            saveStore();
            ui.confirmDeleteId=null;
            render();
          } else {
            errSpan.style.display = "inline";
            pwInput.value = "";
          }
        };
        pwInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") doDelete(); });
        delRow.appendChild(pwInput);
        delRow.appendChild(errSpan);
        delRow.appendChild(el("a",{onClick:doDelete},[t("delete",lang)]));
        delRow.appendChild(el("a",{onClick:()=>{ ui.confirmDeleteId=null; render(); }},[t("cancel",lang)]));
      } else {
        delRow.appendChild(el("a",{onClick:()=>{ ui.confirmDeleteId=s.id; render(); }},[t("delete",lang)]));
      }
      body.appendChild(delRow);
      item.appendChild(body);
    }
    main.appendChild(item);
  });
}

function renderMeasurements(main){
  const lang = state.settings.lang;
  main.appendChild(el("div",{class:"bigTitle"},[ lang==="en" ? "Body Measurements" : "Ukuran Tubuh" ]));

  const form = el("div",{class:"addExerciseCard"});
  const weightIn = el("input",{type:"number", step:"0.1", placeholder: lang==="en"?"Weight (kg)":"Berat (kg)"});
  const waistIn = el("input",{type:"number", step:"0.1", placeholder: lang==="en"?"Waist (cm)":"Pinggang (cm)"});
  form.appendChild(weightIn);
  form.appendChild(waistIn);

  let photoData = null;

  const photoIn = el("input",{type:"file", accept:"image/*", style:"font-size:10px; margin-bottom:6px;"});
  photoIn.addEventListener("change",()=>{
    const file = photoIn.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ photoData = reader.result; photoLbl.textContent = lang==="en" ? `Photo ready (${file.name})` : `Foto siap (${file.name})`; };
    reader.readAsDataURL(file);
  });
  form.appendChild(photoIn);
  form.appendChild(photoLbl);

  form.appendChild(el("button",{class:"btn btn-ghost", onClick:()=>{
    const w = weightIn.value ? parseFloat(weightIn.value) : null;
    const waist = waistIn.value ? parseFloat(waistIn.value) : null;
    if(w===null && waist===null && !photoData) return;
    const entry = { id:"m-"+Date.now(), date:todayLocal(), weight:w, waist:waist, photo:photoData };
    state.measurements = [entry, ...state.measurements];
    saveStore();
    render();
  }},[ lang==="en" ? "+ Log Measurement" : "+ Catat Ukuran" ]));
  main.appendChild(form);

  const weightRows = [...state.measurements].filter(m=>m.weight!=null).sort((a,b)=>a.date.localeCompare(b.date)).map(m=>({date:m.date.slice(5), value:m.weight}));
  if(weightRows.length>=2){
    main.appendChild(el("div",{class:"lbl", style:"margin-top:10px;"},[ lang==="en"?"Weight trend (kg)":"Tren berat (kg)" ]));
    main.appendChild(chartSvg(weightRows));
  }

  if(state.measurements.length){
    main.appendChild(el("div",{class:"lbl", style:"margin-top:10px;"},[ lang==="en"?"History":"Riwayat" ]));
    state.measurements.forEach(m=>{
      const row = el("div",{class:"histItem"});
      const inner = el("div",{style:"padding:10px; display:flex; gap:10px; align-items:center;"});
      if(m.photo){
        const img = el("img",{src:m.photo, style:"width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--surface-alt);"});
        inner.appendChild(img);
      }
      const details = el("div",{style:"flex:1;"});
      details.appendChild(el("div",{class:"mono", style:"font-size:11px; color:var(--text-faint);"},[m.date]));
      const parts = [];
      if(m.weight!=null) parts.push(fmt(m.weight)+"kg");
      if(m.waist!=null) parts.push((lang==="en"?"waist ":"pinggang ")+fmt(m.waist)+"cm");
      details.appendChild(el("div",{class:"mono", style:"font-size:14px; color:var(--amber); font-weight:700;"},[parts.join(" · ")]));
      inner.appendChild(details);
      inner.appendChild(el("span",{class:"del", style:"cursor:pointer; color:var(--text-faint); font-size:11px;", onClick:()=>{
        state.measurements = state.measurements.filter(x=>x.id!==m.id);
        saveStore(); render();
      }},[ lang==="en"?"delete":"hapus" ]));
      row.appendChild(inner);
      main.appendChild(row);
    });
  }
}

<script>
/* ---------------------------------------------------------
   IRON LOG — standalone HTML/JS build (no React, no build step)
   Persists via localStorage. Drop this file anywhere static:
   GitHub Pages, Google Sites "Embed code", any web host.
---------------------------------------------------------- */

const BAR = 20;
const GYM_PLATES = [25,20,15,10,5,2.5];
const MICRO_PLATES = [1,0.75,0.5,0.25];

const MIN_STEP = Math.min(...MICRO_PLATES); // finest increment achievable per side with available plates
const DELETE_PASSWORD = "0822";
const APP_VERSION = "1.9.0"; // bump this on every meaningful release so devices can tell if they're stale

const LIFTS = {
  dfs:    {key:"dfs",    en:"Front Squat (warm-up)", id:"Front Squat (pemanasan)", short:"DFS", workouts:["A","B"], kind:"perSide", inc:0.25, sets:"5×5"},
  sq:     {key:"sq",     en:"Squat",                 id:"Squat",                   short:"SQ",  workouts:["A","B"], kind:"perSide", inc:0.5,  sets:"5×5"},
  bp:     {key:"bp",     en:"Bench Press",           id:"Bench Press",             short:"BP",  workouts:["A"],     kind:"perSide", inc:0.5,  sets:"5×5"},
  rw:     {key:"rw",     en:"Barbell Row",           id:"Barbell Row",             short:"RW",  workouts:["A"],     kind:"perSide", inc:0.25, sets:"5×5"},
  ohp:    {key:"ohp",    en:"Overhead Press",        id:"Overhead Press",          short:"OH",  workouts:["B"],     kind:"perSide", inc:0.25, sets:"5×5"},
  dl:     {key:"dl",     en:"Deadlift",              id:"Deadlift",                short:"DL",  workouts:["B"],     kind:"perSide", inc:0.5,  sets:"1×5"},
  curl:   {key:"curl",   en:"Bicep Curl",            id:"Bicep Curl",              short:"BC",  workouts:["A","B"], kind:"perSide", inc:0.25, sets:"5×5"},
  tricep: {key:"tricep", en:"Close-Grip Tricep Press", id:"Tricep Close-Grip",     short:"TP",  workouts:["A","B"], kind:"perSide", inc:0.5,  sets:"5×5"},
};

const DEFAULT_CURRENT = {dfs:8.25, sq:31, bp:20.5, rw:16.75, ohp:6.75, dl:28.5, curl:0.25, tricep:0.25};

const DICT = {
  appName:{en:"IRON LOG", id:"IRON LOG"},
  tagline:{en:"Every plate, tracked.", id:"Setiap keping, tercatat."},
  today:{en:"Today", id:"Hari Ini"}, log:{en:"Log", id:"Catat"},
  progress:{en:"Progress", id:"Progres"}, history:{en:"History", id:"Riwayat"},
  settings:{en:"Settings", id:"Pengaturan"},
  nextSession:{en:"Next Session", id:"Sesi Berikutnya"}, workout:{en:"Workout", id:"Latihan"},
  perSide:{en:"per side", id:"per sisi"}, totalBar:{en:"total on bar", id:"total di barbel"},
  added:{en:"added weight", id:"beban tambahan"}, bar:{en:"bar", id:"bar"},
  logThisSession:{en:"Log this session", id:"Catat sesi ini"},
  clean:{en:"Clean 5×5", id:"Bersih 5×5"}, missed:{en:"Missed reps", id:"Repetisi gagal"},
  skipped:{en:"Skipped", id:"Dilewati"}, save:{en:"Save session", id:"Simpan sesi"},
  notes:{en:"Notes (optional)", id:"Catatan (opsional)"},
  noSessions:{en:"No sessions logged yet. Start with today's suggested session.", id:"Belum ada sesi tercatat. Mulai dengan sesi yang disarankan hari ini."},
  gymPlates:{en:"Gym plates available", id:"Keping di gym"},
  microPlates:{en:"Your micro-plates", id:"Micro-plate milikmu"},
  barWeight:{en:"Bar weight", id:"Berat bar"},
  increments:{en:"Progression increments", id:"Kenaikan progresif"},
  currentWeights:{en:"Current working weights", id:"Beban kerja saat ini"},
  saved:{en:"Saved", id:"Tersimpan"}, sessionsLogged:{en:"sessions logged", id:"sesi tercatat"},
  delete:{en:"Delete", id:"Hapus"}, confirmDelete:{en:"Delete this session?", id:"Hapus sesi ini?"},
  cancel:{en:"Cancel", id:"Batal"},
  noData:{en:"Not enough sessions logged for this lift yet.", id:"Belum cukup sesi untuk gerakan ini."},
  startFresh:{en:"This tracker starts fresh from today — your current weights are pre-filled from where you left off.", id:"Pelacak ini dimulai baru dari hari ini — beban saat ini sudah diisi dari sesi terakhirmu."},
  onHold:{en:"on hold — missed last attempt", id:"ditahan — repetisi terakhir gagal"},
};
function t(k,lang){ return DICT[k] ? DICT[k][lang] : k; }

function decompose(target, plates){
  let remaining = Math.round(target*100)/100;
  const used = [];
  for(const p of plates){
    while(remaining >= p - 1e-6){ used.push(p); remaining -= p; remaining = Math.round(remaining*100)/100; }
  }
  return {pieces:used, remainder:remaining};
}
function todayLocal(){
  // Uses the device's LOCAL date, not UTC — toISOString() alone shifts to the
  // previous calendar day during early morning hours in timezones ahead of UTC
  // (e.g. WIB, UTC+7), which was blocking correct date entry/editing.
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${yyyy}-${mm}-${dd}`;
}

function fmt(n){
  if(n===undefined||n===null||isNaN(n)) return "-";
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
}
function computeLoad(lift, value){
  if(lift.kind==="perSide"){
    const gym = decompose(value, GYM_PLATES);
    const micro = decompose(gym.remainder, MICRO_PLATES);
    return {gymPieces:gym.pieces, microPieces:micro.pieces, total:BAR+value*2, sideValue:value};
  }
  if(lift.kind==="total"){
    const plateSide = (value-BAR)/2;
    const gym = decompose(plateSide, GYM_PLATES);
    const micro = decompose(gym.remainder, MICRO_PLATES);
    return {gymPieces:gym.pieces, microPieces:micro.pieces, total:value, sideValue:plateSide};
  }
  const gym = decompose(value, GYM_PLATES);
  const micro = decompose(gym.remainder, MICRO_PLATES);
  return {gymPieces:gym.pieces, microPieces:micro.pieces, total:value, sideValue:value};
}

/* ---------------- persistence ---------------- */
const STORE_KEY = "ironlog_v1";
// Reconstructed from chat history — the post-restart "patient pace" phase,
// where every session's numbers were explicitly confirmed. Dates are
// sequential estimates (real calendar dates weren't tracked from the
// start), not exact — edit them in History if you remember the real ones.
const SEEDED_SESSIONS = [
  {date:"2026-08-02", type:"A", lifts:{dfs:2.5,  sq:25,   bp:17.5, rw:15}},
  {date:"2026-08-03", type:"B", lifts:{dfs:5.5,  sq:25.5, ohp:5.25, dl:25.5}},
  {date:"2026-08-04", type:"A", lifts:{dfs:5.75, sq:26,   bp:18.5, rw:15.5}},
  {date:"2026-08-05", type:"A", lifts:{dfs:6,    sq:26.5, bp:18.75, rw:15.75}},
  {date:"2026-08-06", type:"B", lifts:{dfs:6.25, ohp:5.75, sq:27,  dl:26.5}},
  {date:"2026-08-07", type:"A", lifts:{dfs:6.5,  sq:27.5, bp:19.25, rw:16}},
  {date:"2026-08-08", type:"B", lifts:{dfs:6.75, ohp:6,   sq:28,  dl:27}},
  {date:"2026-08-09", type:"A", lifts:{dfs:7,    sq:28.5, bp:19.75, rw:16.25}},
  {date:"2026-08-10", type:"B", lifts:{dfs:7.25, ohp:6.25, sq:29, dl:27.5, curl:0.25, tricep:0.25}},
  {date:"2026-08-11", type:"A", lifts:{dfs:7.5,  sq:29.5, bp:20, rw:16.5, curl:0.5, tricep:0.5}, extra:[{name:"Weighted Pull-ups", detail:"2.5kg"}]},
  {date:"2026-08-12", type:"B", lifts:{dfs:7.75, ohp:6.5, sq:30, dl:28, curl:0.75, tricep:1}, extra:[{name:"Weighted Pull-ups", detail:"3kg"}]},
  {date:"2026-08-13", type:"A", lifts:{dfs:8,    sq:30.5, bp:20.5, rw:16.75, curl:1, tricep:2}},
  {date:"2026-08-14", type:"B", lifts:{dfs:8.25, ohp:6.75, sq:31, dl:28.5, curl:1.25, tricep:2.5}},
].map((s,i)=>{
  const lifts = {};
  Object.entries(s.lifts).forEach(([k,v])=>{ lifts[k] = {value:v, status:"clean"}; });
  return {id:"seed"+i, date:s.date, type:s.type, notes:"", extra:s.extra||[], lifts};
});

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    settings:{
      lang:"en", current:{...DEFAULT_CURRENT},
      increments:Object.fromEntries(Object.values(LIFTS).map(l=>[l.key,l.inc])),
      lastWorkoutType:"B", onHold:{}
    },
    plannedSession:null,
    painLog:[],
    measurements:[],
    sessions:[...SEEDED_SESSIONS].reverse()
  };
}
function saveStore(){
  state._lastLocalChange = new Date().toISOString();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  queueRemotePush();
}
// Used ONLY for one-time schema migrations at load time. These must never look
// like a real, timestamped user change — otherwise a device that's simply
// running an older local copy can wrongly appear "more recent" than a sheet
// that actually has newer data from another device, and clobber it on push.
function saveStoreLocalOnly(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}

/* ---------------- Google Sheets sync ---------------- */
const SYNC_URL = "https://script.google.com/macros/s/AKfycby5gfyDxkdQcxjlB8XxBIz5RXP0mq7uCezV9py_orqhuabw2ADJ-xOBl2HMEVt46SvR/exec";
let syncStatus = "idle"; // idle | syncing | synced | error | offline
let _pushTimer = null;

function setSyncStatus(s){
  syncStatus = s;
  const el = document.getElementById("syncIndicator");
  if(el) el.textContent = syncStatusLabel(s);
}
function syncStatusLabel(s){
  const lang = (state && state.settings && state.settings.lang) || "en";
  const map = {
    idle: lang==="en" ? "Not synced yet" : "Belum sinkron",
    syncing: lang==="en" ? "Syncing…" : "Menyinkronkan…",
    synced: lang==="en" ? "Synced" : "Tersinkron",
    error: lang==="en" ? "Sync failed" : "Sinkron gagal",
  };
  return map[s] || s;
}

function queueRemotePush(){
  if(_pushTimer) clearTimeout(_pushTimer);
  _pushTimer = setTimeout(pushToRemote, 900); // debounce rapid successive saves
}

async function pushToRemote(){
  try{
    setSyncStatus("syncing");
    await fetch(SYNC_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight Apps Script can't handle
      body: JSON.stringify({ state: JSON.stringify(state) }),
    });
    setSyncStatus("synced");
  }catch(e){
    setSyncStatus("error");
  }
}

async function pullFromRemote(){
  try{
    setSyncStatus("syncing");
    const res = await fetch(SYNC_URL, { method:"GET" });
    const data = await res.json();
    if(!data || !data.state) { setSyncStatus("synced"); return; }
    const remoteUpdatedAt = data.updatedAt;
    const localUpdatedAt = state._lastLocalChange;
    const remoteIsNewer = remoteUpdatedAt && (!localUpdatedAt || new Date(remoteUpdatedAt) > new Date(localUpdatedAt));
    if(remoteIsNewer){
      const remoteState = JSON.parse(data.state);
      remoteState._lastLocalChange = remoteUpdatedAt;
      state = remoteState;
      if(state.plannedSession===undefined) state.plannedSession = null;
      if(state.painLog===undefined) state.painLog = [];
      if(state.measurements===undefined) state.measurements = [];
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
      setSyncStatus("synced");
      render();
    } else {
      setSyncStatus("synced");
      pushToRemote(); // make sure remote has our (equally or more current) copy
    }
  }catch(e){
    setSyncStatus("error");
  }
}

function barbellSvgEl(lift, value){
  const load = computeLoad(lift, value);
  const pieces = [...load.gymPieces.map(p=>({p,micro:false})), ...load.microPieces.map(p=>({p,micro:true}))];
  const W=320, H=76, cx=W/2;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width","100%"); svg.setAttribute("height","46");

  function rect(x,y,w,h,fill,rx){
    const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x",x); r.setAttribute("y",y); r.setAttribute("width",w); r.setAttribute("height",h);
    r.setAttribute("fill",fill); if(rx) r.setAttribute("rx",rx);
    return r;
  }
  function txt(x,y,s,size,fill,anchor,weight){
    const tEl = document.createElementNS("http://www.w3.org/2000/svg","text");
    tEl.setAttribute("x",x); tEl.setAttribute("y",y); tEl.setAttribute("font-size",size);
    tEl.setAttribute("fill",fill); tEl.setAttribute("text-anchor",anchor||"middle");
    tEl.setAttribute("font-family","'SF Mono',monospace"); tEl.setAttribute("font-weight",weight||"700");
    tEl.textContent = s;
    return tEl;
  }

  const collarGap = 34;
  const barY = H/2 - 3;
  // sleeve bar (full width, behind plates)
  svg.appendChild(rect(6, barY, W-12, 6, "#57534e", 2));
  // center collar block
  svg.appendChild(rect(cx-collarGap, barY-7, collarGap*2, 20, "#3f3c39", 3));

  function stackSide(dir){
    let x = cx + dir*collarGap;
    pieces.forEach(({p,micro})=>{
      const thickness = Math.max(4, Math.min(11, 3.2 + p*0.55));
      const radius = Math.max(16, Math.min(30, 11 + p*0.85));
      const y = H/2 - radius/2;
      if(dir>0){ svg.appendChild(rect(x, y, thickness, radius, plateColor(p,micro), 2)); x += thickness+1.2; }
      else { x -= thickness+1.2; svg.appendChild(rect(x, y, thickness, radius, plateColor(p,micro), 2)); }
    });
    return x;
  }
  const rightEnd = stackSide(1);
  const leftEnd = stackSide(-1);
  // sleeve end caps
  svg.appendChild(rect(Math.max(rightEnd,cx+collarGap), barY-6, 5, 18, "#78716c", 1));
  svg.appendChild(rect(Math.min(leftEnd,cx-collarGap)-5, barY-6, 5, 18, "#78716c", 1));

  // center total label
  svg.appendChild(txt(cx, 16, fmt(load.total)+"kg", 13, "#f5e6c8", "middle", "800"));
  // per-side labels
  if(lift.kind!=="added"){
    svg.appendChild(txt(cx-collarGap-14, H-6, fmt(load.sideValue), 10, "#9c9691", "end", "600"));
    svg.appendChild(txt(cx+collarGap+14, H-6, fmt(load.sideValue), 10, "#9c9691", "start", "600"));
  }
  return svg;
}

      const row = el("div",{class:"liftRowCompact"});
      row.appendChild(el("div",{class:"lnameWrapShort"},[
        el("span",{class:"lname", style:"display:block;"},[lift.short]),
      ]));
      if(lift.kind==="added" || lift.kind==="total"){
        row.appendChild(el("div",{class:"lcol"}));
        row.appendChild(el("div",{class:"lcol right"},[ el("span",{class:"lval mono"},[fmt(load.total)+"kg"]) ]));
      } else {
        row.appendChild(el("div",{class:"lcol"},[ el("span",{class:"lval small mono"},[fmt(load.sideValue)+"kg"]) ]));
        row.appendChild(el("div",{class:"lcol right"},[ el("span",{class:"lval mono"},[fmt(load.total)+"kg"]) ]));
      }
      content.appendChild(row);
    });
    content.appendChild(el("div",{class:"peekHint"},[ lang==="en" ? "Release to return to today's workout" : "Lepaskan untuk kembali ke latihan hari ini" ]));
    requestAnimationFrame(fitTodayToScreen);
  }

  function enterPeek(e){
    if(e.cancelable) e.preventDefault();
    if(ui.peekingTomorrow) return;
    ui.peekingTomorrow = true;
    todayTab.classList.remove("active");
    tomorrowTab.classList.add("active","peeking");
    paintPreview();
  }
  function exitPeek(){
    if(!ui.peekingTomorrow) return;
    ui.peekingTomorrow = false;
    tomorrowTab.classList.remove("active","peeking");
    todayTab.classList.add("active");
    paintEditable();
  }
  tomorrowTab.addEventListener("pointerdown", enterPeek);
  tomorrowTab.addEventListener("touchstart", enterPeek, {passive:false});
  tomorrowTab.addEventListener("contextmenu", (e)=>e.preventDefault());
  ui._exitPeek = exitPeek; // exposed so the global release listeners can reach this render's closure

  paintEditable();
}

function restLoggedForDate(dateStr){
  return state.sessions.some(s=> s.type==="REST" && s.date===dateStr);
}

function logRestDay(dateStr){
  const d = dateStr || todayLocal();
  if(restLoggedForDate(d)) return; // already logged once for this date — no duplicates
  const record = { id:"rest-"+Date.now(), date:d, type:"REST", notes:"", extra:[], lifts:{} };
  state.sessions = [record, ...state.sessions];
  saveStore();
  ui.todayOverrides = {};
  ui.todayExtras = null;
}

function parseSets(str){
  const parts = str.split(/[×x]/).map(n=>parseInt(n.trim(),10));
  return { sets: parts[0]||5, reps: parts[1]||5 };
}

function startEditSession(session){
  const liftsForType = Object.values(LIFTS).filter(l=>l.workouts.includes(session.type));
  const draft = { date:session.date, type:session.type, notes:session.notes||"", energy:session.energy??null, checklist:{...(session.checklist||{})}, extra:[...(session.extra||[])], lifts:{} };
  liftsForType.forEach(l=>{
    const existing = session.lifts[l.key];
    const defaultPlanned = parseSets(l.sets);
    draft.lifts[l.key] = existing
      ? { value:existing.value, status:existing.status, sets:existing.sets??defaultPlanned.sets, reps:existing.reps??defaultPlanned.reps, plannedSets:existing.plannedSets??defaultPlanned.sets, plannedReps:existing.plannedReps??defaultPlanned.reps }
      : { value:suggestedValue(l.key), status:"clean", sets:defaultPlanned.sets, reps:defaultPlanned.reps, plannedSets:defaultPlanned.sets, plannedReps:defaultPlanned.reps };
  });
  ui.editingSessionId = session.id;
  ui.logDraft = draft;
  ui.tab = "log";
  render();
}

function startLog(type){
  const liftsForType = Object.values(LIFTS).filter(l=>l.workouts.includes(type));
  const plan = state.plannedSession && state.plannedSession.type===type ? state.plannedSession : null;
  const extraSource = ui.todayExtras!==null ? ui.todayExtras : (plan ? (plan.extra||[]) : []);
  const draft = { date:todayLocal(), type, notes: plan?plan.notes||"":"", extra:[...extraSource], lifts:{} };
  liftsForType.forEach(l=>{
    const planned = plan && plan.lifts[l.key];
    const overrideVal = ui.todayOverrides[l.key];
    const value = planned ? planned.value : (overrideVal !== undefined ? overrideVal : suggestedValue(l.key));
    const defaultPlanned = parseSets(l.sets);
    draft.lifts[l.key] = {
      value, status:"clean",
      sets: planned ? planned.sets : defaultPlanned.sets,
      reps: planned ? planned.reps : defaultPlanned.reps,
      plannedSets: defaultPlanned.sets, plannedReps: defaultPlanned.reps
    };
  });
  ui.todayOverrides = {};
  ui.todayExtras = null;
  ui.logDraft = draft;
  ui.tab = "log";
  render();
}

function recomputeStatus(data){
  if(data.sets<=0 || data.reps<=0) data.status = "skipped";
  else if(data.sets>=data.plannedSets && data.reps>=data.plannedReps) data.status = "clean";
  else data.status = "missed";
}

function saveLog(){
  const draft = ui.logDraft;
  const id = Date.now().toString();
  const cleanLifts = {};
  Object.entries(draft.lifts).forEach(([k,d])=>{ cleanLifts[k] = {value:d.value, status:d.status, sets:d.sets, reps:d.reps, plannedSets:d.plannedSets, plannedReps:d.plannedReps}; });
  const record = { id, date:draft.date, type:draft.type, notes:draft.notes, energy:draft.energy??null, checklist:draft.checklist||{}, extra:draft.extra||[], lifts:cleanLifts };
  state.sessions = [record, ...state.sessions];

  const nextCurrent = {...state.settings.current};
  const nextOnHold = {...state.settings.onHold};
  Object.entries(draft.lifts).forEach(([key,data])=>{
    if(data.status==="clean"){ nextCurrent[key]=data.value; nextOnHold[key]=false; }
    else if(data.status==="missed"){ nextCurrent[key]=data.value; nextOnHold[key]=true; }
  });
  state.settings.current = nextCurrent;
  state.settings.onHold = nextOnHold;
  state.settings.lastWorkoutType = draft.type;
  if(state.plannedSession && state.plannedSession.type===draft.type) state.plannedSession = null;

  saveStore();
  ui.logDraft = null;
  ui.tab = "history";
  render();
}

function saveEditedSession(){
  const draft = ui.logDraft;
  const cleanLifts = {};
  Object.entries(draft.lifts).forEach(([k,d])=>{ cleanLifts[k] = {value:d.value, status:d.status, sets:d.sets, reps:d.reps, plannedSets:d.plannedSets, plannedReps:d.plannedReps}; });

  // For each lift touched by this edit, check whether this session is still the MOST RECENT
  // logged record of that lift (searching newest-first, before we mutate anything below).
  // If so, the edit needs to cascade into current progression — otherwise Today would keep
  // showing a stale suggestion built from the old, wrong number.
  const nextCurrent = {...state.settings.current};
  const nextOnHold = {...state.settings.onHold};
  let cascaded = false;
  Object.keys(cleanLifts).forEach(key=>{
    const mostRecentForKey = state.sessions.find(s=> s.lifts && s.lifts[key]);
    if(mostRecentForKey && mostRecentForKey.id===ui.editingSessionId){
      const d = cleanLifts[key];
      if(d.status==="clean"){ nextCurrent[key]=d.value; nextOnHold[key]=false; cascaded=true; }
      else if(d.status==="missed"){ nextCurrent[key]=d.value; nextOnHold[key]=true; cascaded=true; }
    }
  });

  const wasMostRecentSession = state.sessions[0] && state.sessions[0].id===ui.editingSessionId;

  state.sessions = state.sessions.map(s=>
    s.id===ui.editingSessionId
      ? { ...s, date:draft.date, type:draft.type, notes:draft.notes, energy:draft.energy??null, checklist:draft.checklist||{}, extra:draft.extra||[], lifts:cleanLifts }
      : s
  );

  if(cascaded){
    state.settings.current = nextCurrent;
    state.settings.onHold = nextOnHold;
    if(wasMostRecentSession) state.settings.lastWorkoutType = draft.type;
  }

  saveStore();
  ui.editingSessionId = null;
  ui.logDraft = null;
  ui.todayOverrides = {};
  ui.todayExtras = null;
  ui.tab = "history";
  render();
}

      onClick:()=>{ ui.progressLift=l.key; render(); }

  main.appendChild(chipRow);

  const rows = state.sessions
    .filter(s=>s.lifts[ui.progressLift])
